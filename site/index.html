  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0A0A0A; overflow: hidden; }
  body {

    -webkit-tap-highlight-color: transparent;

  canvas[data-disco] {

  /* ---------- corner marks ---------- */
  .mark, .hint { mix-blend-mode: difference; }
  .mark {
    position: fixed; left: max(24px, env(safe-area-inset-left)); top: max(22px, env(safe-area-inset-top));
    font-size: 13px; letter-spacing: -.01em; color: var(--ink); pointer-events: none;
    user-select: none;
  }
  .mark span { color: var(--ink-3); margin-left: 10px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .hint {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
    pointer-events: none; transition: opacity .6s ease; white-space: nowrap;
  }
  body.touched .hint { opacity: 0; }

  /* ---------- toggle ---------- */
  .toggle {
    position: fixed; right: max(20px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top));
    z-index: 3; height: 36px; padding: 0 14px 0 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
    font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .toggle:hover { border-color: rgba(242,241,237,.24); }
  .toggle svg { width: 14px; height: 14px; }
  .toggle:focus-visible, .panel :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }

  /* ---------- panel ---------- */
  .panel {
    position: fixed; z-index: 2; top: max(62px, calc(env(safe-area-inset-top) + 46px)); right: max(20px, env(safe-area-inset-right));
    width: 316px; max-height: calc(100dvh - 82px);
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    -webkit-backdrop-filter: blur(20px) saturate(1.2); backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    transform-origin: top right;
    transition: opacity .22s ease, transform .22s cubic-bezier(.2,.7,.2,1), visibility 0s linear 0s;
  }
  .panel[hidden] { display: flex; opacity: 0; transform: translateY(-6px) scale(.985); visibility: hidden; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; }

  .bar { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar select, .bar button {

  input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 2px;

  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #0A0A0A; border: 1.5px solid var(--ink); }

  .color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }

  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }

/* ===== Ball engine — verbatim from Main.dc.html ===== */
class Component extends DCLogic {

  componentDidMount() {
    if (!this.canvas && typeof document !== 'undefined') {
      var el = document.querySelector('canvas[data-disco]');
      if (el) { this.onCanvas(el); }
    }
  }

  componentWillUnmount() {
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
    this.detach();
  }

  onCanvas(el) {
    if (!el || el === this.canvas) { return; }
    this.detach();
    this.canvas = el;
    this.ctx = el.getContext('2d');
    if (this.yaw === undefined) {
      this.yaw = 0.62;
      this.yawVel = 0.1309;
    }
    // The rig: it holds the ball and the suspension, and only it tilts and sways.
    // The ball inside it is the one thing that spins.
    if (this.tiltX === undefined) {
      this.tiltX = 0;
      this.tiltTarget = 0;
      this.roll = 0;
      this.pitch = 0.11;
    }
    this.last = 0;
    this.o1 = [0, 0, 0];
    this.o2 = [0, 0, 0];
    this.sp = [0, 0, 0, 0, 0, 0, 0, 0];
    this.attach();
    this.resize();
    if (this.raf) { cancelAnimationFrame(this.raf); }
    var self = this;
    var step = function (t) {
      self.raf = requestAnimationFrame(step);
      self.tick(t);
    };
    this.raf = requestAnimationFrame(step);
  }

  attach() {
    var self = this;
    var c = this.canvas;
    if (!c) { return; }
    this.hDown = function (e) {
      if (!self.props || !self.props.manualDragInteraction) { return; }
      self.dragging = true;
      self.px = e.clientX;
      self.py = e.clientY;
      self.ax = 0;
      self.ay = 0;
      c.style.cursor = 'grabbing';
      if (c.setPointerCapture && e.pointerId !== undefined) {
        try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }
    };
    this.hMove = function (e) {
      // The pointer's height over the scene sets where the rig would like to lean.
      // It is only a target: the rig eases toward it, and never more than 0.175 rad.
      if (self.props && self.props.manualDragInteraction && c.getBoundingClientRect) {
        var r = c.getBoundingClientRect();
        if (r.height > 0 && e.clientY > r.top && e.clientY < r.bottom) {
          self.tiltTarget = ((e.clientY - r.top) / r.height - 0.5) * 0.35;
        }
      }
      if (!self.dragging) { return; }
      // Horizontal drag turns the ball, and only the ball.
      var dx = e.clientX - self.px;
      self.px = e.clientX;
      self.py = e.clientY;
      self.yaw += dx * 0.0052;
      self.ax = self.ax * 0.7 + dx * 0.3;
      if (e.cancelable) { e.preventDefault(); }
    };
    this.hUp = function () {
      if (!self.dragging) { return; }
      self.dragging = false;
      c.style.cursor = 'grab';
      self.yawVel = Math.max(-2.8, Math.min(2.8, self.ax * 0.31));
    };
    this.hResize = function () { self.resize(); };
    c.addEventListener('pointerdown', this.hDown);
    window.addEventListener('pointermove', this.hMove, { passive: false });
    window.addEventListener('pointerup', this.hUp);
    window.addEventListener('pointercancel', this.hUp);
    window.addEventListener('resize', this.hResize);
  }

  detach() {
    if (this.canvas && this.hDown) {
      this.canvas.removeEventListener('pointerdown', this.hDown);
    }
    if (this.hMove) {
      window.removeEventListener('pointermove', this.hMove);
      window.removeEventListener('pointerup', this.hUp);
      window.removeEventListener('pointercancel', this.hUp);
      window.removeEventListener('resize', this.hResize);
    }
    this.hDown = null;
    this.hMove = null;
    this.hUp = null;
    this.hResize = null;
  }

  resize() {
    var c = this.canvas;
    if (!c) { return; }
    var w = c.clientWidth || 1200;
    var h = c.clientHeight || 900;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = w;
    this.h = h;
    this.dpr = dpr;
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
  }

  hex(h) {
    if (typeof h !== 'string') { return [0, 0, 0]; }
    var s = h.replace('#', '').replace(/\s/g, '');
    if (s.length === 3) {
      s = s.charAt(0) + s.charAt(0) + s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2);
    }
    if (s.length === 8) { s = s.substring(0, 6); }
    if (s.length !== 6) { return [0, 0, 0]; }
    var n = parseInt(s, 16);
    if (isNaN(n)) { return [0, 0, 0]; }
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }

  lin(h) {
    if (!this.lc) { this.lc = {}; }
    var c = this.lc[h];
    if (c) { return c; }
    var s = this.hex(h);
    c = [Math.pow(s[0], 2.2), Math.pow(s[1], 2.2), Math.pow(s[2], 2.2)];
    this.lc[h] = c;
    return c;
  }

  tint(h) {
    if (!this.tc) { this.tc = {}; }
    var c = this.tc[h];
    if (c) { return c; }
    var s = this.hex(h);
    var l = this.lin(h);
    var mxs = Math.max(s[0], Math.max(s[1], s[2]));
    var t = mxs / 0.10;
    if (t > 1) { t = 1; } else if (t < 0) { t = 0; }
    var mn = (l[0] + l[1] + l[2]) / 3;
    if (mn < 0.00002) { mn = 0.00002; t = 0; }
    var r0 = l[0] / mn, r1 = l[1] / mn, r2 = l[2] / mn;
    r0 = 1 + (r0 - 1) * t;
    r1 = 1 + (r1 - 1) * t;
    r2 = 1 + (r2 - 1) * t;
    c = [r0 * 1.0283, r1 * 1.0283, r2 * 1.0283];
    this.tc[h] = c;
    return c;
  }

  pcol(h) {
    if (!this.pc) { this.pc = {}; }
    var c = this.pc[h];
    if (c) { return c; }
    var s = this.hex(h);
    var l = this.lin(h);
    var mx = Math.max(l[0], Math.max(l[1], l[2]));
    var ms = Math.max(s[0], Math.max(s[1], s[2]));
    if (mx < 0.000001) { c = [0, 0, 0, 0]; }
    else { c = [l[0] / mx, l[1] / mx, l[2] / mx, Math.pow(ms, 1.4)]; }
    this.pc[h] = c;
    return c;
  }

  rig(p) {
    this.pchroma = 1;
    this.pdeep = 1;
    this.blend(p);
    // The master turns the party up, so it scales the lamps themselves too — not just
    // what the room does with them. The range here is deliberately modest: pushing it
    // hard changes which mix the facets show (the tonemap compresses a bright lobe
    // harder than a dim one), and that shifts the ball's own hue, which is not this
    // control's business. Measured drift across the full drag is a couple of degrees.
    // The room's share, scaled far harder, is what carries the sense of intensity.
    var lampG = this.gain(2.2);
    var pInt = (p.partyIntensity == null ? 0 : p.partyIntensity) * lampG;
    var swInt = (p.sweepIntensity == null ? 0 : p.sweepIntensity) * lampG;
    var envG = this.gain(2.4);
    var out = this.plb || (this.plb = []);
    out.length = 0;
    if (pInt < 0.002 && swInt < 0.002) { return out; }
    var cnt = p.partyLightCount == null ? 5 : Math.round(p.partyLightCount);
    var size = p.partySize == null ? 0.085 : p.partySize;
    var spread = p.partyEnergy == null ? 1 : p.partyEnergy;
    this.pmove = Math.min(1.6, 0.45 + 0.38 * spread);
    var ex = 2 / (size * size);
    if (ex < 12) { ex = 12; } else if (ex > 4200) { ex = 4200; }
    var ph = this.lph || [0, 0, 0, 0, 0, 0];
    var wt = [1.0, 0.82, 0.95, 0.74, 0.9];
    var be = [0.55, -0.30, 0.18, 0.72, -0.52];
    var tl = [0.0, 0.35, -0.50, 0.20, 0.60];
    var hx = [
      p.partyColor1 == null ? '#E11D48' : p.partyColor1,
      p.partyColor2 == null ? '#A21CAF' : p.partyColor2,
      p.partyColor3 == null ? '#1D4ED8' : p.partyColor3,
      p.partyColor4 == null ? '#0E9AA7' : p.partyColor4,
      p.partyColor5 == null ? '#6D28D9' : p.partyColor5
    ];
    // Colourfulness. Below 1 it washes the lamps toward neutral. Above 1 the hue
    // ratios are already clamped at full saturation, so pushing further there would
    // do nothing — instead the surplus is handed to the room: `pchroma` scales how
    // strongly surfaces answer the lights and `pdeep` how deep their colour reads.
    // One control, meaningful across its whole range, and the hues stay the ones in
    // the Party Colours section.
    var cf = p.partyColorfulness == null ? 1 : p.partyColorfulness;
    if (cf < 0) { cf = 0; }
    var sat = cf < 1 ? cf : 1;
    var over = cf > 1 ? cf - 1 : 0;
    this.pchroma = (1 + 0.75 * over) * this.gain(1.5);
    this.pdeep = (1 + 0.55 * (over > 1 ? 1 : over)) * this.gain(1.35);
    var sa0 = function (v) {
      var o = 1 + (v - 1) * sat;
      return o < 0 ? 0 : (o > 1 ? 1 : o);
    };
    var i;
    if (pInt >= 0.002) {
      for (i = 0; i < cnt && i < 5; i++) {
        var a = ph[i];
        var e = be[i] * spread + (0.20 + 0.28 * (spread > 1 ? spread - 1 : 0))
          * Math.sin(a * (0.47 + 0.55 * (spread > 1 ? spread - 1 : 0)) + i);
        var ce = Math.cos(e);
        var lx = Math.cos(a) * ce;
        var ly = Math.sin(e);
        var lz = Math.sin(a) * ce;
        var ct = Math.cos(tl[i] * spread), st = Math.sin(tl[i] * spread);
        var ly2 = ly * ct - lz * st;
        var lz2 = ly * st + lz * ct;
        var c = this.pcol(hx[i]);
        if (c[3] < 0.0005) { continue; }
        out.push([lx, ly2, lz2, sa0(c[0]), sa0(c[1]), sa0(c[2]), ex,
          pInt * wt[i] * c[3] * 0.42, wt[i] * c[3] * envG, a]);
      }
    }
    if (swInt >= 0.002) {
      var sa = ph[5];
      var se = 0.12 * Math.sin(sa * 0.31) * spread;
      var sce = Math.cos(se);
      var sc = this.pcol(p.sweepColor == null ? '#F0A24E' : p.sweepColor);
      if (sc[3] >= 0.0005) {
        var sex = ex * 0.42;
        if (sex < 10) { sex = 10; }
        out.push([Math.cos(sa) * sce, Math.sin(se), Math.sin(sa) * sce,
          sa0(sc[0]), sa0(sc[1]), sa0(sc[2]), sex, swInt * sc[3] * 0.50, sc[3] * 1.15 * envG, sa]);
      }
    }
    return out;
  }

  hwBand(cx, y0, y1, hw, py, ft, sharp, tilt) {
    if (y1 <= y0 || hw <= 0.25) { return; }
    var ctx = this.ctx;
    var out = this.o2;
    var n = Math.max(5, Math.round((hw * 2) / 1.6));
    var step = (hw * 2) / n;
    for (var i = 0; i < n; i++) {
      var um = -1 + (2 * i + 1) / n;
      var q = 1 - um * um;
      var nz = Math.sqrt(q > 0.0001 ? q : 0.0001);
      this.shadeF(um * 0.55, py, nz * 0.55, um, tilt, nz, ft, sharp, out);
      ctx.fillStyle = 'rgb(' + out[0] + ',' + out[1] + ',' + out[2] + ')';
      ctx.fillRect(cx - hw + i * step, y0, step + 0.7, y1 - y0);
    }
  }

  hwCap(cx, cy, rx, ry, py, ft, sharp, ny) {
    if (rx <= 0.4 || ry <= 0.2) { return; }
    var ctx = this.ctx;
    var out = this.o2;
    var q = 1 - ny * ny;
    var nz = Math.sqrt(q > 0.0001 ? q : 0.0001);
    this.shadeF(0, py, nz * 0.5, 0, ny, nz, ft, sharp, out);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(' + out[0] + ',' + out[1] + ',' + out[2] + ')';
    ctx.fill();
    ctx.restore();
  }

  // Colour of light landing on a surface. `mix` is how much the surface washes it
  // toward white — a bright studio wall does this, a dark gallery floor barely does.
  // `deep` pulls the secondary channels down so a saturated lamp reads as deep red or
  // rich violet rather than a pastel. Hue always comes from the live rig, never a palette.
  softCol(L, mix, deep) {
    var r = L[3], g = L[4], b = L[5];
    if (deep) {
      var e = 1 + deep;
      r = Math.pow(r, e); g = Math.pow(g, e); b = Math.pow(b, e);
    }
    r += (1 - r) * mix; g += (1 - g) * mix; b += (1 - b) * mix;
    return 'rgba(' + Math.round(r * 255) + ',' + Math.round(g * 255) + ','
      + Math.round(b * 255) + ',';
  }

  // One lamp's spill on a surface. The stops trace 1/(1+(d/r)^2)^2 — inverse-square
  // falloff with a soft core — so light concentrates near its source and the far side
  // of the room stays dark. `rh` is the reach, where it has decayed to nothing.
  lampPool(cx, cy, rw, rh, col, a, rot) {
    if (a < 0.002 || rw < 1 || rh < 1) { return; }
    // A hard ceiling discarded everything above it, so past a point extra energy
    // stopped reading as extra colour. A soft knee keeps the response monotonic:
    // more light always means more colour, it just gains ground more slowly.
    a = 0.72 * (1 - Math.exp(-a / 0.46));
    var ctx = this.poolCtx || this.ctx;
    var s = this.poolS == null ? 1 : this.poolS;
    var fo = this.fallFor(this.bgFall == null ? 1 : this.bgFall), i;
    cx *= s; cy *= s; rw *= s; rh *= s;
    ctx.save();
    ctx.translate(cx, cy);
    if (rot) { ctx.rotate(rot); }
    ctx.scale(rw / rh, 1);
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, rh);
    for (i = 0; i < fo.length; i++) {
      g.addColorStop(fo[i][0], col + (a * fo[i][1]).toFixed(4) + ')');
    }
    ctx.fillStyle = g;
    ctx.fillRect(-rh, -rh, rh * 2, rh * 2);
    ctx.restore();
  }

  // The light's own falloff curve, with Background Contrast as a gamma on it. Above
  // 1 the light drops away faster, so lit and unlit parts of the room separate and
  // shadows deepen; below 1 it lingers, and the room lights more evenly. This is
  // where contrast actually lives — steepening the base wall gradient alone barely
  // moves a room whose brightness is mostly coming from the lamps. Cached per gamma.
  fallFor(g) {
    if (!this.fallBase) {
      this.fallBase = [[0, 1], [0.10, 0.89], [0.20, 0.66], [0.30, 0.45],
        [0.45, 0.21], [0.60, 0.095], [0.75, 0.038], [0.88, 0.011], [1, 0]];
    }
    if (!(g > 0.05)) { g = 1; }
    if (g === 1) { return this.fallBase; }
    if (!this.fallCache) { this.fallCache = {}; }
    var key = g.toFixed(3);
    if (this.fallCache[key]) { return this.fallCache[key]; }
    var b = this.fallBase, out = [];
    for (var i = 0; i < b.length; i++) { out.push([b[i][0], Math.pow(b[i][1], g)]); }
    this.fallCache[key] = out;
    return out;
  }

  // One lamp's light on a surface is not a single disc. There is the concentrated
  // patch where it lands, and around it the much broader, weaker field left by the
  // glass scattering it and the room bouncing it. Drawing all three is what makes
  // neighbouring lamps merge into continuous transitions instead of sitting on the
  // wall as separate coloured blobs — the wide components overlap long before the
  // cores do. Each lobe is offset along the lamp's own direction, so the cluster
  // leans the way the light travels and moves only when the rig moves.
  lampField(cx, cy, rw, rh, col, a, dx, dy, ph, gal) {
    if (!this.lobes) {
      // radius, strength, how far along the lamp's direction the lobe sits
      this.lobes = [[0.66, 1.00, 0.00], [1.12, 0.40, 0.20], [1.70, 0.13, 0.46]];
    }
    var lo = this.lobes;
    // Colour Blend: how much of a field's energy sits in its wide outer lobes, which
    // is what makes neighbouring colours merge rather than stay as separate pools.
    var bl = this.bgBlend == null ? 1 : this.bgBlend;
    // How alive the fields are. `ph` is the lamp's OWN phase from the rig, so this
    // motion is the party's motion: Party Speed sets its rate and Party Energy its
    // amplitude, and there is no second clock anywhere in the scene. It falls to zero
    // at the studio end, where the room should be still.
    var amp = 0.26 * gal * (this.pmove == null ? 1 : this.pmove);
    for (var i = 0; i < lo.length; i++) {
      var r = lo[i][0], k = lo[i][1], off = lo[i][2];
      if (i > 0) { k *= bl; r *= 1 + 0.30 * (bl - 1); }
      var px = cx + dx * rw * off, py = cy + dy * rh * off;
      var rwi = rw * r, rhi = rh * r, rot = 0;
      if (amp > 0.002 && ph != null) {
        var aa = ph + i * 1.9;
        // Three incommensurate sinusoids per axis: the field wanders on a path that
        // never repeats, so the room never looks like it is looping.
        var wx = (Math.sin(aa) + 0.5 * Math.sin(2.3 * aa + 1.7) + 0.3 * Math.sin(4.1 * aa + 0.4)) / 1.8;
        var wy = (Math.cos(1.13 * aa) + 0.5 * Math.cos(2.7 * aa + 0.9) + 0.3 * Math.cos(3.7 * aa + 2.2)) / 1.8;
        px += wx * rwi * amp;
        py += wy * rhi * amp;
        // Slow turn, and a breathing aspect: the patch of light stretches and rounds
        // off again as the beam's angle onto the surface changes.
        rot = aa * 0.23 + i * 0.8;
        rwi *= 1 + (0.18 + 0.42 * gal) * (0.5 + 0.5 * Math.sin(aa * 0.7 + i));
      }
      this.lampPool(px, py, rwi, rhi, col, a * k, rot);
    }
  }

  // Colour is accumulated at a quarter resolution and blitted up. The downscale is
  // what dissolves the seams between fields: at full resolution each gradient keeps
  // its own edge, and the wall reads as a set of discs rather than as light.
  envBuf(W, H) {
    if (typeof document === 'undefined') { return null; }
    var s = 0.25;
    var w = Math.max(2, Math.round(W * s)), h = Math.max(2, Math.round(H * s));
    if (!this.eb) { this.eb = { el: document.createElement('canvas') }; }
    var b = this.eb;
    if (b.w !== w || b.h !== h) {
      b.el.width = w; b.el.height = h; b.w = w; b.h = h; b.s = s;
      b.ctx = b.el.getContext('2d');
    }
    return b.ctx ? b : null;
  }

  mottle(key) {
    if (!this.mt) { this.mt = {}; }
    var c = this.mt[key];
    if (c) { return c; }
    if (typeof document === 'undefined') { return null; }
    var n = 128;
    c = document.createElement('canvas');
    c.width = n;
    c.height = n;
    var g = c.getContext('2d');
    if (!g) { return null; }
    var seed = key === 'wall' ? 7717 : 3391;
    var rnd = function () {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
    var cnt = key === 'wall' ? 30 : 44;
    for (var i = 0; i < cnt; i++) {
      var x = rnd() * n, y = rnd() * n;
      var r = n * (0.09 + rnd() * 0.30);
      var a = 0.04 + rnd() * 0.09;
      var lite = rnd() > 0.5;
      var gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, (lite ? 'rgba(255,255,255,' : 'rgba(0,0,0,') + a.toFixed(3) + ')');
      gr.addColorStop(1, lite ? 'rgba(255,255,255,0)' : 'rgba(0,0,0,0)');
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    this.mt[key] = c;
    return c;
  }

  // The two ends of the Studio <-> Gallery drag. They are constants, not controls,
  // because the slider's whole job is to sit between them: a duplicate pair of
  // per-mode sliders is what this phase removes.
  get EB() { return 1.25; }        // studio exposure
  get GB() { return 0.55; }        // gallery exposure
  get EWT() { return '#ffffff'; }  // studio wall
  get GWT() { return '#14151C'; }  // gallery wall
  get EFT() { return '#ffffff'; }  // studio floor
  get GFT() { return '#1A1B21'; }  // gallery floor

  // Where the drag currently sits, 0 = studio, 1 = gallery. Everything that used to
  // branch on a mode now reads this, so there is exactly one source of the blend.
  // Party Environment: the one environmental axis. 0 is the calmest, brightest,
  // most neutral studio; 1 is the darkest, richest, most energetic gallery. Every
  // environmental system reads this — it is the position itself, not a preset pair.
  blend(p) {
    var v = p.partyEnvironment == null ? 25 : p.partyEnvironment;
    v = v / 100;
    if (!(v >= 0)) { v = 0; } else if (v > 1) { v = 1; }
    this.gal = v;
    return v;
  }

  // ...and the gain it applies to the party system. The individual party sliders stay
  // the underlying tuning; this only scales what those settings do at runtime, so
  // dragging the master never rewrites a tweak value. It runs from a division by `hi`
  // at the calm end, through exactly 1 at the middle of the travel, to a multiplication
  // by `hi` at the party end — geometric, so there is no kink anywhere along the drag.
  // It never reaches zero, which is the point for anything that lights the BALL: the
  // ball's own colour is not this control's business and must survive the calm end.
  gain(hi) {
    var m = this.gal == null ? 0.25 : this.gal;
    return Math.pow(hi, 2 * m - 1);
  }

  // A 0-100 fine-tuning control read as a multiplier: 1/hi at 0, exactly 1 at 50,
  // hi at 100. Centring at 50 means every one of these starts with no effect, so the
  // scene you already have is the scene you keep until you move something.
  bgk(p, key, hi) {
    var v = p[key];
    if (v == null) { v = 50; }
    v = v / 50 - 1;
    if (!(v >= -1)) { v = -1; } else if (v > 1) { v = 1; }
    return Math.pow(hi, v);
  }

  // Background Colour Balance, per lamp. A lamp's own red-minus-blue decides which
  // side of the balance it sits on, so turning the control warm simply gives the warm
  // lamps already in the rig more of the room. No palette is invented, and at the
  // centre every lamp is weighted exactly as before.
  warmK(L, k) {
    if (k === 1) { return 1; }
    var warm = (L[3] - L[5] + 1) * 0.5;
    if (warm < 0) { warm = 0; } else if (warm > 1) { warm = 1; }
    return Math.pow(k, (warm - 0.5) * 2);
  }

  mixHex(a, b, t) {
    var x = this.hex(a), y = this.hex(b);

      ctx.lineTo(sp[6], sp[7]);
      ctx.closePath();
      ctx.fillStyle = 'rgb(' + fr + ',' + fg + ',' + fb + ')';
      ctx.fill();

      var sdx = fnx, sdy = -fny;
      var sdl = Math.sqrt(sdx * sdx + sdy * sdy);
      var thPx = th * (f / (d - ccz));
      if (sdl > 1e-6) { sdx /= sdl; sdy /= sdl; } else { sdx = 0; sdy = 0; }
      var wallPx = thPx * sdl;
      var wr = (fr * wf) | 0, wg = (fg * wf) | 0, wb = (fb * wf) | 0;

      for (k = 0; k < 4; k++) {
        var nb = ft.bn[k];
        if (!nb) { continue; }
        var k1 = (k + 1) & 3;
        var ex1 = (sp[k * 2] + sp[k1 * 2]) * 0.5 - mx;
        var ey1 = (sp[k * 2 + 1] + sp[k1 * 2 + 1]) * 0.5 - my;
        var el1 = Math.sqrt(ex1 * ex1 + ey1 * ey1);
        var wall = 0;
        if (el1 > 1e-6 && wallPx > 0.01) {
          var dp = -((ex1 / el1) * sdx + (ey1 / el1) * sdy);
          if (dp > 0) { wall = wallPx * dp; }
        }
        var wid = bevBase * ft.bw + occBase * ft.sm + wall;
        if (wid < 0.28) { continue; }

        var bx1 = nb[0] * cyw + nb[2] * syw;
        var bz0 = -nb[0] * syw + nb[2] * cyw;
        var bnx = bx1 * crl - nb[1] * srl;
        var by1 = bx1 * srl + nb[1] * crl;
        var bny = by1 * cpp - bz0 * spp;
        var bnz = by1 * spp + bz0 * cpp;
        this.shadeF(ccx, ccy, ccz, bnx, bny, bnz, ft, ft.rg, bc);

        var wgt = (occBase * ft.sm * 0.75 + wall) / wid;
        if (wgt > 1) { wgt = 1; }
        var iw = 1 - wgt;
        var er = (bc[0] * iw + wr * wgt) | 0;
        var eg = (bc[1] * iw + wg * wgt) | 0;
        var eb = (bc[2] * iw + wb * wgt) | 0;
        if (wall < 0.14 && er > fr - 3 && er < fr + 3 && eg > fg - 3 && eg < fg + 3) { continue; }

        ctx.beginPath();
        ctx.moveTo(sp[k * 2], sp[k * 2 + 1]);
        ctx.lineTo(sp[k1 * 2], sp[k1 * 2 + 1]);
        ctx.lineWidth = wid;
        ctx.strokeStyle = 'rgb(' + er + ',' + eg + ',' + eb + ')';
        ctx.stroke();
      }

      if (sts) { this.starTile(sts, sp, fnx, fny, fnz, pxs * 0.25, pys * 0.25, pzs * 0.25, d, f, ox, oy); }
    }

    ctx.restore();
    this.beams(p, W, H, ox, oy, sil, d, f, cyw, syw, cpp, spp, crl, srl);
    this.hanger(p, W, H, ox, oy, sil, true);
    this.envMirror(p, W, H, ox, oy, sil);
    if (sts) { this.starDraw(p, sts, sil); }
    this.envPost(p, W, H, ox, oy, sil);
  }

  // ---- Star sparkles ------------------------------------------------------------
  //
  // A few places where a reflection is so intense that the camera renders it as a
  // star: a pinpoint white core, thin sharp rays from the lens's star filter, a trace
  // of bloom and a fast falloff. The star is a camera phenomenon laid over the ball;
  // the facets underneath are shaded exactly as before, and with the effect off the
  // ball is unchanged.
  //
  // What decides where a star is, is a mirror law, not an attachment. Each sparkle has
  // a light direction that is fixed in the room. Its Position controls say where on
  // the (smooth) ball that light would be mirrored into the lens — X across, Y up and
  // down, Depth from the silhouette (0) to straight at the camera (1) — and the light
  // direction follows from that: L = 2(n·v)n − v at that point. The ball's spin, sway
  // and lean never touch L.
  //
  // Every frame each visible tile is tested against every sparkle's light: how far its
  // own reflected view ray (from its real, tilted, spinning normal) is from L. Tiles
  // near alignment catch the light; the best one or two carry the star. As the ball
  // turns, the tile that was in line swings out and fades while its neighbour swings
  // in and brightens, and within a tile the reflection slides across it the way the
  // lamp's image slides across a turning mirror. Their strength is set by Party
  // Environment and the sparkle controls only, independent of the party lights.
  starSetup(p, ox, oy, sil, d, rb, f, ts) {
    if (p.sparkleShow === false) { return null; }
    var gI = p.sparkleIntensity == null ? 1 : p.sparkleIntensity;
    var gP = p.sparklePresence == null ? 1 : p.sparklePresence;
    if (gI <= 0 || gP <= 0 || !(f > 0) || !(d > rb)) { return null; }
    // The light's image in the mirror is a flat-topped beam exactly one tile pitch
    // across (in reflected angle a tile pitch is twice the tiles' angular size, since
    // a mirror turns a ray by twice its own turn). With that profile, cos²(πa/2A), two
    // neighbouring tiles always split the light between them so that their shares add
    // up to one: as one swings out of line the next swings in by exactly as much.
    var A = 2 * ts;
    if (A < 0.06) { A = 0.06; } else if (A > 0.5) { A = 0.5; }
    var sig = A * 0.5;
    var cg = Math.cos(A);
    var out = this.stb || (this.stb = []);
    out.length = 0;
    for (var k = 1; k <= 8; k++) {
      var pre = 'sparkle' + k;
      if (p[pre + 'Show'] !== true) { continue; }
      var px = p[pre + 'X'] || 0, py = p[pre + 'Y'] || 0, pz = p[pre + 'Depth'];
      if (pz == null) { pz = 1; }
      if (pz < 0.02) { pz = 0.02; }
      var pl = Math.sqrt(px * px + py * py + pz * pz);
      px /= pl; py /= pl; pz /= pl;
      // the point on the ball this sparkle's light is mirrored from, and that light
      var Sx = px * rb, Sy = py * rb, Sz = pz * rb;
      var vx = -Sx, vy = -Sy, vz = d - Sz;
      var vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
      vx /= vl; vy /= vl; vz /= vl;
      var ndv = px * vx + py * vy + pz * vz;
      if (ndv < 0.02) { ndv = 0.02; }
      out.push({
        k: k, sig: sig, A: A, cg: cg,
        lx: 2 * ndv * px - vx, ly: 2 * ndv * py - vy, lz: 2 * ndv * pz - vz,
        size: p[pre + 'Size'] == null ? 1 : p[pre + 'Size'],
        inten: p[pre + 'Intensity'] == null ? 1 : p[pre + 'Intensity'],
        sharp: p[pre + 'Sharpness'] == null ? 0.75 : p[pre + 'Sharpness'],
        pres: p[pre + 'Presence'] == null ? 0.9 : p[pre + 'Presence'],
        c: []
      });
    }
    return out.length ? out : null;
  }

  // One drawn tile against every sparkle's light. n: its normal this frame; c: its
  // centre; sp: its screen corners.
  starTile(sts, sp, nx, ny, nz, cx, cy, cz, d, f, ox, oy) {
    var vx = -cx, vy = -cy, vz = d - cz;
    var vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
    vx /= vl; vy /= vl; vz /= vl;
    var ndv = nx * vx + ny * vy + nz * vz;
    if (ndv <= 0.02) { return; }
    // where this tile's mirror is looking
    var rx = 2 * ndv * nx - vx, ry = 2 * ndv * ny - vy, rz = 2 * ndv * nz - vz;
    for (var i = 0; i < sts.length; i++) {
      var s = sts[i];
      var ca = rx * s.lx + ry * s.ly + rz * s.lz;
      if (ca < s.cg) { continue; }
      if (ca > 1) { ca = 1; }
      var a = Math.acos(ca);
      if (a >= s.A) { continue; }
      var cw = Math.cos(1.5707963 * a / s.A);
      // a tile turned edge-on to the camera shows the light only faintly
      var eg = (ndv - 0.02) / 0.4;
      if (eg > 1) { eg = 1; }
      var w = cw * cw * eg * eg * (3 - 2 * eg);
      if (w < 0.003) { continue; }
      var c = s.c;
      // where the lamp's image falls on this tile's plane (the mirror point)
      var nl = nx * s.lx + ny * s.ly + nz * s.lz;
      var mx = (sp[0] + sp[2] + sp[4] + sp[6]) * 0.25, my = (sp[1] + sp[3] + sp[5] + sp[7]) * 0.25;
      var hx = mx, hy = my;
      if (nl > 0.01) {
        var ix = s.lx - 2 * nl * nx, iy = s.ly - 2 * nl * ny, iz = s.lz - 2 * nl * nz;
        var t = (nx * cx + ny * cy + nz * (cz - d)) / -nl;
        var Pz = d + iz * t;
        if (t > 0 && d - Pz > 0.05) {
          var sP = f / (d - Pz);
          var dx = ox + ix * t * sP - mx, dy = oy - iy * t * sP - my;
          var dl = Math.sqrt(dx * dx + dy * dy);
          if (dl > 1e-6) {
            // the image sweeps across the tile as it turns; its centroid stays on it
            var half = 0.35 * (Math.abs(sp[0] - sp[4]) + Math.abs(sp[1] - sp[5]));
            var K = 1.2 * s.sig * f;
            var g = half * 0.7 * Math.tanh(dl / K) / dl;
            hx = mx + dx * g; hy = my + dy * g;
          }
        }
      }
      c.push({ w: w, x: hx, y: hy });
    }
  }

  // The stars themselves, drawn the way a lens renders an overexposed point.
  starDraw(p, sts, sil) {
    var gInt = p.sparkleIntensity == null ? 1 : p.sparkleIntensity;
    var gSize = p.sparkleSize == null ? 1 : p.sparkleSize;
    var gSharp = p.sparkleSharpness == null ? 1 : p.sparkleSharpness;
    var gPres = p.sparklePresence == null ? 1 : p.sparklePresence;
    // colour temperature and the balance of the long ray pairs, per star
    var TINT = [[1.00, 0.99, 0.96, 1.18], [0.97, 0.99, 1.00, 1.05], [1.00, 1.00, 0.98, 1.25],
      [0.98, 0.99, 1.00, 0.95], [1.00, 0.98, 0.95, 1.10], [0.97, 0.99, 1.00, 1.20],
      [1.00, 0.99, 0.97, 1.00], [0.98, 1.00, 1.00, 1.12]];
    // Party Environment brings them up with the room: all but gone in the studio,
    // clear by the middle, intense at the top.
    var m = this.gal == null ? 0 : this.gal;
    var mE = Math.pow(m, 1.6);
    // The sparkles' lights are their own fixed lamps: they do not depend on the party
    // rig's intensity, lamp count or colours. Only Party Environment and the sparkle
    // controls set how strongly they show.
    var rig = 0.9;
    var sc = sil / 150;
    if (sc < 0.6) { sc = 0.6; } else if (sc > 2.2) { sc = 2.2; }
    var ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // Every tile catching a sparkle's light is its own reflection: each gets its own
    // core and bloom at exactly its own strength, so the tile swinging out of line
    // dims while the one swinging in brightens. The star-filter rays are long next to
    // the gap between two tiles, so the rays of both overlap into one star: they are
    // drawn once, from the light-weighted centre of everything the sparkle's light is
    // reaching, with the combined strength. That centre slides from one tile to the
    // next as their strengths trade, and the combined strength stays even through the
    // hand-over, so it reads as one reflection travelling, not two stars. The camera
    // integrates light over its exposure (~1/20 s), which is the only smoothing.
    var dt = this.fdt == null ? 0.016 : this.fdt;
    if (!(dt > 0)) { dt = 0; }
    var kS = 1 - Math.exp(-dt / 0.05);
    var mem = this.stM || (this.stM = {});
    for (var j = 0; j < sts.length; j++) {
      var s = sts[j], T = TINT[(s.k - 1) & 7];
      var pres = gPres * s.pres;
      if (pres <= 0) { continue; }
      var o = {
        size: gSize * s.size, sharp: Math.max(0, Math.min(1, gSharp * s.sharp)),
        pres: pres, sc: sc, sil: sil, T: T,
        rgb: (T[0] * 255 | 0) + ',' + (T[1] * 255 | 0) + ',' + (T[2] * 255 | 0)
      };
      var base = gInt * s.inten * mE * rig;
      var W = 0, X = 0, Y = 0, n;
      for (n = 0; n < s.c.length; n++) { W += s.c[n].w; X += s.c[n].w * s.c[n].x; Y += s.c[n].w * s.c[n].y; }
      if (W > 1e-9) { X /= W; Y /= W; }
      var M = mem[s.k];
      if (!M) { M = mem[s.k] = { W: W, x: X, y: Y }; }
      else {
        if (M.W < 0.02 || kS === 0) { if (W > 1e-9) { M.x = X; M.y = Y; } }
        else if (W > 1e-9) { M.x += (X - M.x) * kS; M.y += (Y - M.y) * kS; }
        M.W = kS === 0 ? W : M.W + (W - M.W) * kS;
      }
      for (n = 0; n < s.c.length; n++) { this.starPart(0, s.c[n].x, s.c[n].y, base * s.c[n].w, o); }
      this.starPart(1, M.x, M.y, base * M.W, o);
      for (n = 0; n < s.c.length; n++) { this.starPart(2, s.c[n].x, s.c[n].y, base * s.c[n].w, o); }
    }
    ctx.restore();
  }

  // One part of a star at strength I: 0 bloom, 1 rays, 2 core.
  starPart(kind, x, y, I, o) {
    if (!(I >= 0.004)) { return; }
    var ctx = this.ctx, size = o.size, sc = o.sc, rgb = o.rgb, T = o.T;
    // a dimmer star is also a softer one
    var sharp = o.sharp * (0.72 + 0.28 * Math.min(1, Math.sqrt(I)));
    var vis = Math.pow(Math.min(1, I * 1.5), 1.2) * o.pres;
    var gI = Math.sqrt(I);
    if (kind === 0) {
      // bloom: only a trace, and only as bright as the point itself
      var sz = size * sc;
      var br = (5 + 12 * gI) * sz;
      var bl = ctx.createRadialGradient(x, y, 0, x, y, br);
      var ba = 0.26 * vis * (1.3 - 0.6 * sharp);
      bl.addColorStop(0, 'rgba(' + rgb + ',' + ba.toFixed(3) + ')');
      bl.addColorStop(0.15, 'rgba(' + rgb + ',' + (ba * 0.30).toFixed(3) + ')');
      bl.addColorStop(0.45, 'rgba(' + rgb + ',' + (ba * 0.06).toFixed(3) + ')');
      bl.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.fillStyle = bl;
      ctx.fillRect(x - br, y - br, br * 2, br * 2);
    } else if (kind === 1) {
      // rays: four long ones and four short diagonals, one orientation for every star
      // (it is one lens); each a thin tapered wedge fading fast from the core
      var L0 = o.sil * 0.50 * size * (0.25 + 0.75 * gI);
      var w0 = (3.2 - 1.8 * sharp) * Math.sqrt(size) * Math.max(0.8, Math.min(1.5, sc));
      for (var r = 0; r < 8; r++) {
        var diag = r & 1;
        var an = r * Math.PI * 0.25;
        var len = diag ? L0 * 0.40 : L0 * ((r === 0 || r === 4) ? T[3] : 1 / T[3]);
        var wd = diag ? w0 * 0.7 : w0;
        var ra = Math.min(1, vis * (diag ? 0.95 : 1.5));
        this.starRay(x, y, an, len, wd, ra, rgb, sharp);
        // the hot inner part of the ray, where it leaves the core
        this.starRay(x, y, an, len * 0.32, wd * 1.15, ra * 0.8, rgb, sharp);
        // the ray's soft skirt, which a softer lens spreads wider
        this.starRay(x, y, an, len * 0.5, wd * (3.0 - 1.4 * sharp), ra * 0.10 * (1.3 - sharp), rgb, 0);
      }
    } else {
      // the core: a pinpoint, pure white
      var cR = (1.5 + 2.0 * gI) * Math.sqrt(size) * Math.max(0.8, Math.min(1.4, sc));
      var cg2 = ctx.createRadialGradient(x, y, 0, x, y, cR * 2);
      cg2.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, vis * 1.3).toFixed(3) + ')');
      cg2.addColorStop(0.4, 'rgba(255,255,255,' + Math.min(1, vis * 1.1).toFixed(3) + ')');
      cg2.addColorStop(0.7, 'rgba(' + rgb + ',' + (vis * 0.22).toFixed(3) + ')');
      cg2.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.fillStyle = cg2;
      ctx.fillRect(x - cR * 2, y - cR * 2, cR * 4, cR * 4);
    }
  }

  starRay(x, y, an, len, wd, a, rgb, sharp) {
    if (len < 1 || a < 0.004) { return; }
    var ctx = this.ctx;
    var dx = Math.cos(an), dy = Math.sin(an), nx = -dy, ny = dx;
    var hw = wd * 0.5;
    var gr = ctx.createLinearGradient(x, y, x + dx * len, y + dy * len);
    // falloff: steep near the core, a long faint tail; a sharper lens keeps the tail
    var e = 1.1 + 1.0 * (1 - sharp);
    for (var k = 0; k <= 7; k++) {
      var u = k / 7;
      var v = Math.pow(1 - u, e) * (0.55 + 0.45 / (1 + 6 * u));
      gr.addColorStop(u, 'rgba(' + rgb + ',' + (a * v).toFixed(3) + ')');
    }
    ctx.fillStyle = gr;
    // a fine line that narrows toward its tip
    var tw = hw * 0.22;
    ctx.beginPath();
    ctx.moveTo(x + nx * hw, y + ny * hw);
    ctx.lineTo(x + dx * len + nx * tw, y + dy * len + ny * tw);
    ctx.lineTo(x + dx * len - nx * tw, y + dy * len - ny * tw);
    ctx.lineTo(x - nx * hw, y - ny * hw);
    ctx.closePath();
    ctx.fill();
  }

  // The bright white spots a mirror ball throws around a room.
  //
  // These are not drawn rays. Each facet is a mirror, so a lamp striking it leaves
  // along R = 2(N.L)N - L. That ray is followed until it meets the wall plane or the
  // floor plane, and the spot is lit where it lands. Everything therefore falls out of
  // geometry already in the scene: the facet's own rotated normal, the lamp directions
  // from the existing rig, and the camera. Turn the ball and the spots sweep; move the
  // rig and they follow. There is no second animation and no overlay.
  beams(p, W, H, ox, oy, sil, d, f, cyw, syw, cpp, spp, crl, srl) {
    if (crl == null) { crl = 1; srl = 0; }
    var amt = p.beamLight == null ? 1 : p.beamLight;
    if (amt < 0.004) { return; }
    amt *= this.gain(2.6);
    var pls = this.pl;
    var fs = this.facets;
    if (!pls || !pls.length || !fs || !fs.length) { return; }
    var baseY = this.baseY == null ? H * 0.84 : this.baseY;
    var ctx = this.ctx;

    // The room's two planes, in the same world units the ball is built in. The floor
    // is placed so that where it meets the wall lands exactly on the painted floor
    // line — the beams and the room agree about where the floor is.
    var Zw = 2.6;
    var Yf = (baseY - oy) * (d + Zw) / f;
    if (!(Yf > 0.2)) { return; }

    // The spots are gathered in a half-resolution buffer and composited once.
    // Additively blending a hundred rotated sprites straight onto the main canvas
    // measured three times the cost of doing it here and blitting the result, and the
    // slight softening a half-res buffer gives is what reflected light looks like.
    var bf = this.beamBuf(W, H);
    if (!bf) { return; }
    var bx = bf.ctx, bs = bf.s;
    bx.setTransform(1, 0, 0, 1, 0, 0);
    bx.globalCompositeOperation = 'source-over';
    bx.clearRect(0, 0, bf.w, bf.h);
    bx.globalCompositeOperation = 'lighter';
    bx.imageSmoothingEnabled = true;

    // Facet outermost, lamps inside: rotating a facet into world space is the costly
    // part, and it does not depend on which lamp is striking it.
    var stride = Math.max(2, Math.round(fs.length / 190));
    var nl = pls.length;
    var tints = this.btint || (this.btint = []);
    tints.length = 0;
    for (var q = 0; q < nl; q++) {
      var Lq = pls[q];
      // A specular highlight of a strong lamp reads white; only a trace of the lamp's
      // own colour survives in it, which is what keeps these part of the same rig.
      // Each gets its own sprite, because drawImage ignores fillStyle.
      tints.push(this.beamSprite(Math.round(255 * (0.84 + 0.16 * Lq[3])),
        Math.round(255 * (0.84 + 0.16 * Lq[4])), Math.round(255 * (0.84 + 0.16 * Lq[5]))));
    }
    var drawn = 0, li, i;
    for (i = 0; i < fs.length; i += stride) {
      if (drawn > 420) { break; }
      var ft = fs[i];
      // The facet's normal and centre where they actually are this frame.
      var n1 = ft.nx * cyw + ft.nz * syw;
      var nz0 = -ft.nx * syw + ft.nz * cyw;
      var n0 = n1 * crl - ft.ny * srl;
      var ny1 = n1 * srl + ft.ny * crl;
      var ny = ny1 * cpp - nz0 * spp;
      var nz = ny1 * spp + nz0 * cpp;
      var cx1 = ft.cx * cyw + ft.cz * syw;
      var cz0 = -ft.cx * syw + ft.cz * cyw;
      var cx0 = cx1 * crl - ft.cy * srl;
      var cy1 = cx1 * srl + ft.cy * crl;
      var cy = cy1 * cpp - cz0 * spp;
      var cz = cy1 * spp + cz0 * cpp;
      var px0 = cx0;
      var fj = ft.j == null ? 1 : ft.j;

      for (li = 0; li < nl; li++) {
        var L = pls[li];
        var amp = L[7] == null ? 0 : L[7];
        if (amp < 0.02) { continue; }
        var lx = L[0], ly = L[1], lz = L[2];
        var ndl = n0 * lx + ny * ly + nz * lz;
        if (ndl <= 0.34) { continue; }
        var sp = tints[li];
        if (!sp) { continue; }

        var rx = 2 * ndl * n0 - lx;
        var ry = 2 * ndl * ny - ly;
        var rz = 2 * ndl * nz - lz;

        // Where does that ray first meet the room?
        var t = -1, onFloor = false;
        if (rz < -0.02) { t = (-Zw - cz) / rz; }
        if (ry < -0.02) {
          var tf = (-Yf - cy) / ry;
          if (tf > 0.02 && (t < 0 || tf < t)) { t = tf; onFloor = true; }
        }
        if (t <= 0.02 || t > 60) { continue; }

        var qx = px0 + rx * t, qy = cy + ry * t, qz = cz + rz * t;
        var ss = f / (d - qz);
        if (!(ss > 0)) { continue; }
        var hx = ox + qx * ss, hy = oy - qy * ss;
        if (hx < -W * 0.2 || hx > W * 1.2 || hy < -H * 0.2 || hy > H * 1.2) { continue; }
        // A spot cannot be on the wall below the floor line, or on the floor above it.
        if (onFloor ? hy < baseY - 2 : hy > baseY + 2) { continue; }

        // Energy: the facet's own foreshortening, its individual reflectivity, and the
        // beam spreading as it travels.
        var e = amp * ndl * ndl * Math.sqrt(ndl) * fj / (1 + 0.09 * t * t);
        if (e < 0.020) { continue; }

        // The footprint is an ellipse because the beam meets the surface at an angle:
        // it stretches along the beam's own direction WITHIN that surface, by one over
        // the cosine of incidence. Stretching along the screen direction from the ball
        // instead is what turns honest spots into a drawn sunburst, so the axis is
        // found by stepping along the in-plane direction and projecting that step.
        var cosI = onFloor ? -ry : -rz;

          if (s2 > 0) { ang = Math.atan2((oy - q2y * s2) - hy, (ox + q2x * s2) - hx); }
        }

        // rather than a reflection, and every extra pixel is additive blending.

        // answer these lamps directly, so any spot that could touch it is not cast.
        var ddx2 = hx - ox, ddy2 = hy - oy;

    ctx.imageSmoothingEnabled = true;

    ctx.restore();
  }

  renderVals() {

  }

  env(p, W, H, ox, oy, sil) {

    // state (0) and the gallery state (1); every property below is read off that
    // position, so stopping anywhere on the drag gives a real environment rather than
    // a dark sheet laid over the bright one.

    // a linear ramp would dump most of the darkening into the last quarter of the drag.
    // Background Brightness is the room's own exposure, so it belongs here with the

    // is allowed to touch the architecture. The five colour controls are nowhere near
    // this line: they act only on the coloured light added to the room later.

    // gallery the light on the wall falls off harder from its centre, which is where
    // the cinematic contrast comes from — the room gets darker AND less uniform,
    // rather than merely dimmer.

    wg.addColorStop(0.46, this.stop(mulW(0.985), bright));

    ctx.fillRect(0, 0, W, baseY);

    var tr = Math.max(W, H) * (0.46 + 0.34 * frost);
    var ta = 0.085 * frost * (1 + (0.22 - 1) * gal);

      tg.addColorStop(0, 'rgba(255,253,246,' + ta.toFixed(3) + ')');
      tg.addColorStop(0.55, 'rgba(255,253,246,' + (ta * 0.42).toFixed(3) + ')');
      tg.addColorStop(1, 'rgba(255,253,246,0)');

      ctx.fillRect(0, 0, W, baseY);

    var hzg = ctx.createLinearGradient(0, 0, W, 0);
    var ha = ((0.085 + (0.16 - 0.085) * gal) + 0.05 * frost) * this.bgk(p, 'bgContrast', 1.5);
    hzg.addColorStop(0, 'rgba(0,0,0,' + (ha * 0.92).toFixed(3) + ')');
    hzg.addColorStop(0.45, 'rgba(0,0,0,0)');
    hzg.addColorStop(1, 'rgba(0,0,0,' + ha.toFixed(3) + ')');

    ctx.fillRect(0, 0, W, baseY);

    if (gref > 0.004) {
      var rg = ctx.createLinearGradient(0, baseY * 0.62, 0, baseY);
      rg.addColorStop(0, 'rgba(255,255,255,0)');
      rg.addColorStop(1, 'rgba(255,255,255,' + (0.055 * gref).toFixed(3) + ')');
      ctx.fillStyle = rg;
      ctx.fillRect(0, baseY * 0.62, W, baseY * 0.38);
    }

    var mw = this.mottle('wall');
    if (mw) {
      ctx.save();
      ctx.globalAlpha = (0.11 + (0.07 - 0.11) * gal) * (0.5 + 0.5 * frost);

    }

    if (floorOn) {
    var ffall = 1 + 1.5 * gal * this.bgk(p, 'bgContrast', 2.2);
    var fdip = function (k) { return 1 - (1 - k) * ffall; };
    var fg = ctx.createLinearGradient(0, baseY, 0, H);

    fg.addColorStop(0.42, this.stop(mulF(fdip(0.86)), bright));
    fg.addColorStop(1, this.stop(mulF(fdip(0.70)), bright));
    ctx.fillStyle = fg;
    ctx.fillRect(0, baseY, W, H - baseY);

    var mf = this.mottle('floor');
    if (mf && tex > 0.004) {
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      var fh = H - baseY;
      for (i = 0; i < 3; i++) {
        ctx.globalAlpha = 0.085 * tex * (0.45 + 0.28 * i);

          baseY + fh * (i / 3) - (fh / 3) * 0.2, W * (1.2 + 0.5 * i), (fh / 3) * 1.5);
      }
      ctx.globalAlpha = 0.05 * tex;
      for (i = 0; i < 2; i++) {
        ctx.drawImage(mf, 0, 0, 128, 128, W * (0.5 * i - 0.1), baseY, W * 0.7, fh);

    if (frough < 0.995) {
      var pol = ctx.createLinearGradient(0, baseY, 0, baseY + (H - baseY) * (0.55 + 0.4 * (1 - frough)));
      var pa = (0.10 * (1 - frough) + 0.02) * (1 + (0.55 - 1) * gal);
      pol.addColorStop(0, 'rgba(255,255,255,' + pa.toFixed(3) + ')');
      pol.addColorStop(0.45, 'rgba(255,255,255,' + (pa * 0.38).toFixed(3) + ')');
      pol.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = pol;
      ctx.fillRect(0, baseY, W, H - baseY);

    var seam = ctx.createLinearGradient(0, baseY - H * 0.016, 0, baseY + H * 0.042);
    seam.addColorStop(0, 'rgba(0,0,0,0)');
    seam.addColorStop(0.3, 'rgba(0,0,0,' + (0.075 + (0.14 - 0.075) * gal).toFixed(4) + ')');
    seam.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillRect(0, baseY - H * 0.016, W, H * 0.058);

    // with that gap, so the pool softens as the ball rises.

    // normalised so each mode's default reproduces its approved look exactly.
    var refK = 1 + 0.55 * gal;

    var sw = ctx.createRadialGradient(ox, contact, 0, ox, contact, Math.max(W, H) * (0.40 + 0.10 * gapN));
    sw.addColorStop(0, 'rgba(255,255,255,' + swa.toFixed(3) + ')');
    sw.addColorStop(0.5, 'rgba(255,255,255,' + (swa * 0.34).toFixed(3) + ')');
    sw.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sw;
    ctx.fillRect(0, baseY, W, H - baseY);
    }

    this.envLights(p, W, H, ox, oy, sil, baseY, gal, frost, frough);

    this.baseY = baseY;
    this.gapN = gapN;
  }

  envLights(p, W, H, ox, oy, sil, baseY, gal, frost, frough) {

    // a bright studio can still be pushed to a strong colour response.

    // end. The floor is a whisper rather than a flat zero so the ball still reads as
    // standing in the room at 0 instead of pasted onto it.

    // is ADDED to the room that has already been painted, so none of them can change
    // the wall's or floor's own exposure, tone or material — only how much of the
    // party's colour lands on them, how far it reaches, how it blends and how rich it
    // reads. With the lamps off, these five do literally nothing.

    var richK = this.bgk(p, 'colorRichness', 1.7);

    // whole room toward black, so it works from both ends: the light's tail drops
    // away faster AND its lit parts are lifted, which deepens the unlit room while
    // keeping the overall exposure roughly where it was.
    this.bgFall = this.bgk(p, 'bgContrast', 1.25);
    var conK = this.bgk(p, 'bgContrast', 2.0);

    var ctx = this.ctx;

    // the colours are shared, the surfaces just answer them with different strength,
    // reach and chroma. Gallery reads as a small private party — richer colour held
    // close to the ball. Studio stays neutral, with just enough bounce that the ball
    // belongs to the room.
    var wallK = (0.048 + (0.44 - 0.048) * gal) * infl * conK;
    var floorK = (0.062 + (0.50 - 0.062) * gal) * infl * conK;

    // dark — the intimacy comes from that falloff, not from enclosing the room.
    // Colour used to be pulled TIGHTER as the room darkened, which is why the
    // background stayed neutral at the top of the travel. It now reaches further as
    // well as growing stronger, so the lamps overlap and blend across the wall, while
    // the inverse-square tail still leaves the far corners dark. Reach, not a tint.

    // what puts different colours in different corners instead of stacking them all

    if (floorMix > 1) { floorMix = 1; }

            reach * (0.42 + 0.55 * frough), reach * 0.95,

    var en = tw / (1 + tw);

    var C = [0, 0, 0, r, g, b];

    this.rigEn = en;
    var ctx = this.ctx;
    var self = this;

    // Two physically different things happen at the two ends of the drag, and a
    // canvas composite operation cannot be interpolated between them. So both are
    // drawn, each weighted by where the drag sits. In the middle the surface is a
    // mid grey that genuinely does a little of each: it absorbs the missing
    // wavelengths and it picks up a little added light. Nothing switches over.
    //
    // Dark end: the bounce is light added to near-black, so it adds.
    var addAmp = 0.115 * infl * en * gal;

    // it does nothing. What actually happens is the reverse — the complementary
    // wavelengths are missing from the bounce, so the surface loses a little green
    // and blue under a red ball. That is a multiply, and it is how the studio shows
    // the ball's colour without gaining any brightness.
    var mulAmp = 0.95 * infl * en * (1 - gal);

      ctx.beginPath();

      ctx.clip();
      ctx.globalCompositeOperation = mode;

      // scatters. Wide on purpose: a pool the size of the ball would put all of its
      // light behind the ball, where nothing can see it. The visible part is the tail.
      self.lampPool(ox, oy, sil * (3.9 + 1.5 * frost), sil * (3.5 + 1.4 * frost),

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, baseY, W, H - baseY);
        ctx.clip();
        ctx.globalCompositeOperation = mode;

        self.lampPool(ox, baseY + sil * 0.10, sil * (2.6 + 1.2 * frough), sil * 2.0,
          floorCol, amp * 0.85 * (1 - 0.25 * frough));
        ctx.restore();
      }
    };

  }
  function set(k, v, fromUI) {
    props[k] = v;            // the engine reads props every frame: no re-render needed
    var r = rows[k];
    if (r) {
      r.el.classList.toggle('changed', v !== DEFAULTS[k]);
      if (!fromUI) { r.sync(v); }
      else if (r.out) { r.out.textContent = fmt(k, v); }
    }
    persist();
  }
  function setAll(obj) {
    KEYS.forEach(function (k) { set(k, k in obj ? obj[k] : DEFAULTS[k]); });
  }

  // group by section, keep schema order
  var sections = [];
  var bySection = {};
  KEYS.forEach(function (k) {
    var sec = SCHEMA[k].section || 'Other';
    if (!bySection[sec]) { bySection[sec] = []; sections.push(sec); }
    bySection[sec].push(k);
  });
  // fold Sparkle 1…8 into one group so the list stays short
  var single = sections.filter(function (s) { return !/^Sparkle \d$/.test(s); });
  var multi = sections.filter(function (s) { return /^Sparkle \d$/.test(s); });

  function control(k) {
    var s = SCHEMA[k];
    var id = 'c-' + k;
    var row = document.createElement('div');
    row.className = 'row';
    var label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = human(k);
    label.title = 'Click to reset';
    label.addEventListener('click', function (e) {
      if (!row.classList.contains('changed')) { return; }
      e.preventDefault();
      set(k, DEFAULTS[k]);
    });
    row.appendChild(label);
    var r = { el: row };

    if (s.editor === 'boolean') {
      var sw = document.createElement('span'); sw.className = 'switch';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = id; cb.checked = !!props[k];
      cb.addEventListener('change', function () { set(k, cb.checked, true); });
      sw.appendChild(cb); sw.appendChild(document.createElement('i'));
      row.appendChild(sw);
      r.sync = function (v) { cb.checked = !!v; };
    } else if (s.editor === 'color') {
      var wrap = document.createElement('span'); wrap.className = 'color';
      var pick = document.createElement('input'); pick.type = 'color'; pick.id = id;
      var txt = document.createElement('input'); txt.type = 'text'; txt.spellcheck = false; txt.maxLength = 7;
      txt.setAttribute('aria-label', human(k) + ' hex');
      var norm = function (v) { return /^#[0-9a-f]{3}$/i.test(v) ? '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3] : v.slice(0, 7); };
      pick.value = norm(props[k]); txt.value = props[k];
      pick.addEventListener('input', function () { txt.value = pick.value; set(k, pick.value, true); });
      txt.addEventListener('change', function () {
        var v = txt.value.trim(); if (v[0] !== '#') { v = '#' + v; }
        if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) { v = v.toLowerCase(); pick.value = norm(v); txt.value = v; set(k, v, true); }
        else { txt.value = props[k]; }
      });
      wrap.appendChild(pick); wrap.appendChild(txt); row.appendChild(wrap);
      r.sync = function (v) { pick.value = norm(v); txt.value = v; };
    } else {
      var out = document.createElement('output'); out.className = 'val'; out.htmlFor = id;
      out.textContent = fmt(k, props[k]);
      var rg = document.createElement('input'); rg.type = 'range'; rg.id = id;
      rg.min = s.min; rg.max = s.max; rg.step = s.step || 1; rg.value = props[k];
      fill(rg);
      rg.addEventListener('input', function () { fill(rg); set(k, Number(rg.value), true); });
      row.appendChild(out); row.appendChild(rg);
      r.out = out;
      r.sync = function (v) { rg.value = v; fill(rg); out.textContent = fmt(k, v); };
    }
    row.classList.toggle('changed', props[k] !== DEFAULTS[k]);
    rows[k] = r;
    return row;
  }

  function group(title, keys, open, count) {
    var d = document.createElement('details');
    if (open) { d.open = true; }
    var sm = document.createElement('summary');
    sm.textContent = title;
    if (count) { var n = document.createElement('span'); n.className = 'n'; n.textContent = count; sm.appendChild(n); }
    d.appendChild(sm);
    var body = document.createElement('div'); body.className = 'rows';
    d.appendChild(body);
    // build rows lazily the first time the group opens: 100+ controls stay cheap
    var built = false;
    function build() {
      if (built) { return; } built = true;
      keys.forEach(function (k) {
        if (typeof k === 'string') { body.appendChild(control(k)); }
        else { body.appendChild(k); }
      });
    }
    if (open) { build(); }
    d.addEventListener('toggle', function () { if (d.open) { build(); } });
    d._build = build;
    return d;
  }

  var groups = [];
  single.forEach(function (sec, i) {
    var g = group(sec, bySection[sec], i < 2);
    groups.push(g); root.appendChild(g);
  });
  if (multi.length) {
    var inner = multi.map(function (sec) { return group(sec, bySection[sec], false); });
    var g = group('Individual sparkles', inner, false, String(multi.length));
    g.addEventListener('toggle', function () { if (!g.open) { return; } });
    groups.push(g); root.appendChild(g);
  }
  // page options
  (function () {
    var row = document.createElement('div'); row.className = 'row';
    var label = document.createElement('label'); label.htmlFor = 'c-res'; label.textContent = 'Resolution';
    var sel = document.createElement('select'); sel.id = 'c-res';
    sel.style.cssText = 'height:26px;border-radius:6px;border:1px solid var(--line);background:rgba(242,241,237,.04);color:var(--ink);font:inherit;font-size:12px;padding:0 8px;';
    [[2, 'Sharp (2×)'], [1.5, 'Balanced (1.5×)'], [1, 'Fast (1×)'], [0.75, 'Fastest (0.75×)']].forEach(function (o) {
      var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1];
      op.style.background = '#141312';
      if (o[0] === PAGE.maxDpr) { op.selected = true; }
      sel.appendChild(op);
    });
    sel.addEventListener('change', function () { PAGE.maxDpr = Number(sel.value); ball.resize(); persist(); });
    row.appendChild(label); row.appendChild(sel);
    var row2 = document.createElement('div'); row2.className = 'row';
    var l2 = document.createElement('label'); l2.htmlFor = 'c-fit'; l2.textContent = 'Fit ball on phones';
    var sw = document.createElement('span'); sw.className = 'switch';
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'c-fit'; cb.checked = PAGE.fit;
    cb.addEventListener('change', function () { PAGE.fit = cb.checked; persist(); });
    sw.appendChild(cb); sw.appendChild(document.createElement('i'));
    row2.appendChild(l2); row2.appendChild(sw);
    var g = group('Page', [row, row2], false);
    root.appendChild(g);
  })();

  // make sure any key changed by a link/preset is visible as changed once its group opens
  function buildAll() { groups.forEach(function (g) { g._build(); }); }

  /* ---------- presets & actions ---------- */
  var presetSel = document.getElementById('preset');
  var custom = document.createElement('option'); custom.value = ''; custom.textContent = 'Preset…';
  presetSel.appendChild(custom);
  Object.keys(PRESETS).forEach(function (name) {
    var o = document.createElement('option'); o.value = name; o.textContent = name; presetSel.appendChild(o);
  });
  presetSel.addEventListener('change', function () {
    if (!presetSel.value) { return; }
    setAll(PRESETS[presetSel.value]);
    toast(presetSel.value);
    presetSel.value = '';
  });

  var toastEl = document.getElementById('toast'), toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 1600);
  }
  function copy(text, msg) {
    var done = function () { toast(msg); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Couldn’t copy'); }
      ta.remove();
    }
  }
  document.getElementById('copyLink').addEventListener('click', function () {
    var h = toHash(diff());
    copy(location.origin + location.pathname + (h ? '#' + h : ''), 'Link copied');
  });
  document.getElementById('copyJson').addEventListener('click', function () {
    copy(JSON.stringify(Object.assign({}, props), null, 2), 'All settings copied as JSON');
  });
  document.getElementById('reset').addEventListener('click', function () { setAll({}); toast('Back to the hero look'); });

  window.addEventListener('hashchange', function () {
    var h = fromHash(); if (h) { setAll(clean(h)); }
  });

  /* ---------- open / close ---------- */
  var panel = document.getElementById('panel');
  var toggle = document.getElementById('toggle');
  function open(on) {
    panel.hidden = !on;
    toggle.setAttribute('aria-expanded', String(on));
    toggle.querySelector('span').textContent = on ? 'Close' : 'Tweak';
  }
  toggle.addEventListener('click', function () { open(panel.hidden); });
  panel.addEventListener('keydown', function (e) { if (e.key === 'Escape') { open(false); toggle.focus(); } });
  if (window.matchMedia('(min-width: 641px)').matches && !/[?&]clean\b/.test(location.search)) { open(true); }
  if (/[?&]clean\b/.test(location.search)) {
    toggle.style.display = 'none';
    document.querySelector('.mark').style.display = 'none';
    document.querySelector('.hint').style.display = 'none';
  }

  // Pause drawing when the page is hidden (rAF already throttles; this stops it fully).
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (ball.raf) { cancelAnimationFrame(ball.raf); ball.raf = 0; } }
    else if (!ball.raf) {
      ball.last = 0;
      var step = function (t) { ball.raf = requestAnimationFrame(step); ball.tick(t); };
      ball.raf = requestAnimationFrame(step);
    }
  });

  window.zcBall = { props: props, set: set, setAll: setAll, defaults: DEFAULTS };
})();
</script>
</body>
</html>
